<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EROL EXECUTIVE TERMINAL</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #121212;
      --border: rgba(212, 175, 55, 0.2);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --white: #f5f5f5;
      --gray: #666666;
      --green: #00ff66;
      --red: #ff3366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; overflow-x: hidden; }

    /* Üst Çizgi ve Başlık */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 0.9rem; letter-spacing: 3px; font-weight: 600; color: var(--white); display: flex; align-items: center; gap: 8px; }
    .gold-dot { width: 6px; height: 6px; background-color: var(--gold); border-radius: 50%; box-shadow: 0 0 8px var(--gold); }
    .status { font-size: 0.75rem; color: var(--gray); font-family: monospace; letter-spacing: 1px; }

    /* Izgara Düzeni */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin: 20px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 4px; transition: border-color 0.3s ease; overflow: hidden; }
    .card:hover { border-color: var(--gold); }
    .card-title { font-size: 0.7rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }

    /* Taşmayan Esnek Küresel Saatler */
    .clocks { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; }
    .clock-item { 
      flex: 1 1 0px; 
      min-width: 0; 
      text-align: center; 
      padding: 8px 2px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.08);
    }
    .clock-label { font-size: 0.65rem; color: var(--gray); letter-spacing: 1.5px; font-weight: 600; white-space: nowrap; }
    .clock-time { 
      font-size: clamp(0.85rem, 2.5vw, 1.1rem); 
      font-family: monospace; 
      color: var(--gold-light); 
      margin-top: 6px; 
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Fiyat Listesi */
    .ticker { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: monospace; font-size: 0.85rem; }
    .ticker:last-child { margin-bottom: 0; }
    .ticker-val { color: var(--white); }
    .up { color: var(--green); font-size: 0.75rem; }
    .down { color: var(--red); font-size: 0.75rem; }

    /* Merkez Kart */
    .hero-card { grid-column: 1 / -1; background: linear-gradient(180deg, #141414 0%, #0a0a0a 100%); border: 1px solid var(--border); padding: 35px 20px; text-align: center; border-radius: 4px; cursor: pointer; transition: 0.3s; }
    .hero-card:hover { border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
    .hero-title { font-size: 1.4rem; font-weight: 300; letter-spacing: 5px; color: var(--white); margin-bottom: 8px; }
    .hero-sub { font-size: 0.75rem; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; }

    /* Gizli Servet Kartı */
    #vault-card { display: none; grid-column: 1 / -1; background: #111; border: 1px solid var(--gold); padding: 25px; text-align: center; border-radius: 4px; }
    .vault-amount { font-size: 2.2rem; font-family: monospace; color: var(--gold-light); letter-spacing: 2px; margin: 10px 0 5px 0; }
    .vault-status { font-size: 0.7rem; color: var(--green); letter-spacing: 2px; font-family: monospace; margin-bottom: 15px; }
    
    /* Borsa Akışlı Çizgi Grafik Konteyneri */
    .zigzag-chart {
      width: 250px;
      height: 60px;
      margin: 0 auto;
      background: #000;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 8px;
    }
    .zigzag-chart svg { width: 100%; height: 100%; overflow: visible; }
    
    /* Sarı Borsa Çizgisi */
    .gold-stroke {
      fill: none;
      stroke: var(--gold);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-dashoffset 0.5s ease-in-out;
    }

    /* Pop-up Şifre Paneli */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #121212; border: 1px solid var(--gold); padding: 30px; text-align: center; border-radius: 6px; width: 300px; }
    .modal-box h3 { font-size: 0.9rem; letter-spacing: 2px; color: var(--gold); margin-bottom: 15px; }
    .modal-box input { width: 100%; background: #000; border: 1px solid var(--border); color: var(--gold-light); padding: 10px; text-align: center; font-family: monospace; font-size: 1.2rem; outline: none; border-radius: 4px; margin-bottom: 15px; }
    .modal-box button { width: 100%; background: var(--gold); color: #000; border: none; padding: 10px; font-weight: bold; letter-spacing: 1px; cursor: pointer; border-radius: 4px; }

    footer { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid var(--border); font-size: 0.65rem; color: var(--gray); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="gold-dot"></div>
      EROL EXECUTIVE TERMINAL
    </div>
    <div class="status">SYSTEM: ONLINE</div>
  </header>

  <div class="grid">
    <!-- Saatler -->
    <div class="card">
      <div class="card-title">KÜRESEL ZAMAN DİLİMLERİ</div>
      <div class="clocks">
        <div class="clock-item"><div class="clock-label">LONDRA</div><div class="clock-time" id="london">--:--</div></div>
        <div class="clock-item"><div class="clock-label">NEW YORK</div><div class="clock-time" id="ny">--:--</div></div>
        <div class="clock-item"><div class="clock-label">TOKYO</div><div class="clock-time" id="tokyo">--:--</div></div>
      </div>
    </div>

    <!-- Piyasalar / Fiyatlar -->
    <div class="card">
      <div class="card-title">FİYATLAR</div>
      <div class="ticker"><span>GOLD / USD</span><span class="ticker-val" id="gold-val">2,412.50 <span id="gold-diff" class="up">▲ +0.8%</span></span></div>
      <div class="ticker"><span>EUR / USD</span><span class="ticker-val" id="eur-val">1.0885 <span id="eur-diff" class="up">▲ +0.2%</span></span></div>
    </div>

    <!-- Merkez Kimlik Kartı -->
    <div class="hero-card" onclick="openPassModal()">
      <div class="hero-title">EFE EROL</div>
      <div class="hero-sub">PRIVATE PORTFOLIO & MANAGEMENT</div>
    </div>

    <!-- Gizli Servet Paneli -->
    <div id="vault-card">
      <div class="card-title">ANLIK PORTFÖY DEĞERİ</div>
      <div class="vault-amount" id="portfolio-val">₺25,000.00</div>
      <div class="vault-status">•CANLI</div>
      
      <!-- Fiyatın Altında Sabit Kayarak İlerleyen Borsa Çizgisi -->
      <div class="zigzag-chart">
        <svg viewBox="0 0 240 50">
          <path id="zigzag-line" class="gold-stroke" d="" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Şifre Paneli -->
  <div class="modal" id="passModal">
    <div class="modal-box">
      <h3>VIP ERİŞİM ŞİFRESİ</h3>
      <input type="password" id="passInput" maxlength="4" placeholder="••••">
      <button onclick="checkPass()">ONAYLA</button>
    </div>
  </div>

  <footer>
    <div>REF: 884-X9</div>
    <div>SECURE ENCRYPTION</div>
  </footer>

  <script>
    // Saat Fonksiyonu
    function updateClocks() {
      const now = new Date();
      const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      document.getElementById('london').innerText = new Intl.DateTimeFormat('en-GB', { ...options, timeZone: 'Europe/London' }).format(now);
      document.getElementById('ny').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'America/New_York' }).format(now);
      document.getElementById('tokyo').innerText = new Intl.DateTimeFormat('ja-JP', { ...options, timeZone: 'Asia/Tokyo' }).format(now);
    }
    updateClocks();
    setInterval(updateClocks, 1000);

    // Canlı Piyasalar
    setInterval(() => {
      const gDiff = (Math.random() * 2 - 0.9).toFixed(1);
      const eDiff = (Math.random() * 0.8 - 0.35).toFixed(2);
      
      document.getElementById('gold-diff').className = gDiff >= 0 ? 'up' : 'down';
      document.getElementById('gold-diff').innerText = (gDiff >= 0 ? '▲ +' : '▼ ') + gDiff + '%';
      
      document.getElementById('eur-diff').className = eDiff >= 0 ? 'up' : 'down';
      document.getElementById('eur-diff').innerText = (eDiff >= 0 ? '▲ +' : '▼ ') + eDiff + '%';
    }, 2500);

    // Modal Kontrolleri
    function openPassModal() {
      document.getElementById('passModal').style.display = 'flex';
      document.getElementById('passInput').focus();
    }

    function checkPass() {
      const input = document.getElementById('passInput').value;
      if (input === '1923') {
        document.getElementById('passModal').style.display = 'none';
        document.getElementById('vault-card').style.display = 'block';
        startPortfolioStream();
      } else {
        alert('HATALI ŞİFRE');
        document.getElementById('passInput').value = '';
      }
    }

    // Sabit Koordinat Aralıkları (Soldan Sağa Akış)
    const xPoints = [0, 30, 60, 90, 120, 150, 180, 210, 240];
    let priceHistory = [25000, 25000, 25000, 25000, 25000, 25000, 25000, 25000, 25000];

    function renderChart() {
      let d = "";
      priceHistory.forEach((price, i) => {
        // Fiyat Orantılama: ₺30.000 -> Y=5 (Yukarıda), ₺20.000 -> Y=45 (Aşağıda)
        const y = 45 - ((price - 20000) / 10000) * 40;
        d += (i === 0 ? `M ${xPoints[i]},${y}` : ` L ${xPoints[i]},${y}`);
      });
      document.getElementById('zigzag-line').setAttribute('d', d);
    }

    // İlk Çizim
    renderChart();

    // 20.000 TL - 30.000 TL Borsa Veri Akışı
    function startPortfolioStream() {
      setInterval(() => {
        const newPrice = (Math.random() * (30000 - 20000) + 20000);
        const formatted = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2 }).format(newPrice.toFixed(2));
        document.getElementById('portfolio-val').innerText = '₺' + formatted;

        // Geçmiş verileri sola kaydır (En eski kaybolur, yeni fiyat en sağa eklenir)
        priceHistory.shift();
        priceHistory.push(newPrice);

        renderChart();
      }, 2000);
    }
  </script>
</body>
</html>
